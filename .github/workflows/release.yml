name: Release

# Everything the development branch gets, plus a tag and a published package -
# and only if every stage passed first. A release that skips the checks is
# indistinguishable from one that ran them and got lucky, so the publishing job
# needs all four to have succeeded.
#
# The version is major.minor from the VERSION file with the run number as the
# third component, so every build of main is identifiable and monotonic.
# module.info gets major.build instead, because Webmin compares versions
# numerically and reads a three-part string as its first component only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache CPAN modules
        uses: actions/cache@v6
        with:
          path: local
          key: cpan-${{ runner.os }}-${{ hashFiles('cpanfile') }}
      - run: make perldeps
      - run: make scan
      - run: make lint
      - run: make test
      - run: make verify BUILD_NUMBER=${{ github.run_number }}

  real-dependencies:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache checkouts
        uses: actions/cache@v6
        with:
          path: |
            .webmin
            .easyrsa
          key: refs-${{ runner.os }}-webmin-2.653-easyrsa-v3.1.7
      - run: make apicheck
      - run: make e2e-matrix

  tunnel:
    name: E2E tunnel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tun device
        run: |
          sudo modprobe tun || true
          test -c /dev/net/tun
      - run: make e2e-tunnel

  webmin:
    name: E2E Webmin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make e2e-webmin

  publish:
    name: Publish
    needs: [checks, real-dependencies, tunnel, webmin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          base=$(cat VERSION)
          release="$base.${{ github.run_number }}"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=v$release" >> "$GITHUB_OUTPUT"
          echo "Release $release"

      # A tag that already exists means this run number has been used, which
      # should not happen - stopping is better than moving someone else's tag.
      - name: Check tag is new
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Build release assets
        run: |
          make verify BUILD_NUMBER=${{ github.run_number }}
          make dist BUILD_NUMBER=${{ github.run_number }}

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.release }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release }}
          generate_release_notes: true
          # Everything make dist assembles. SHA256SUMS covers all of it, so
          # publishing a subset leaves a checksum file naming assets that are
          # not there - and an installer that reads that list and fails.
          files: build/dist/*
          fail_on_unmatched_files: true
