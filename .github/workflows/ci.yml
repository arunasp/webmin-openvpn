name: CI

# The same stages the local runner executes, in the same order, so a green
# check here means what a green `make all` means. Jobs are split by what they
# need: the first needs nothing, the second needs the network to fetch upstream
# dependencies, and the last two need a container and a tun device.

# Pull requests, from this repository and from forks alike. main is handled
# by release.yml, which runs the same stages and then tags and publishes.
#
# There is no push trigger. With both, every branch that has a pull request
# open runs the whole pipeline twice, and the two runs produce check names
# that differ only by an event suffix - so a branch protection rule naming
# the job has nothing to match, and sits waiting for a status that will not
# arrive. A fork contributor only ever generates the pull_request event here
# anyway: their push happens in their own repository.
#
# The cost is that a branch with no pull request open gets no CI. Open a
# draft pull request to get it, or run make all locally, which is the same
# set of stages.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Perl::Critic is a project-local dependency, cached on the key of the
      # manifest that pins it. A cache miss costs one cpanm run, not a wrong
      # result.
      - name: Cache CPAN modules
        uses: actions/cache@v6
        with:
          path: local
          key: cpan-${{ runner.os }}-${{ hashFiles('cpanfile') }}

      - name: Install CPAN modules
        run: make perldeps

      - name: Scan
        run: make scan

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build and verify
        run: |
          make verify BUILD_NUMBER=${{ github.run_number }}
          make dist BUILD_NUMBER=${{ github.run_number }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webmin-module
          path: |
            build/dist/*
          if-no-files-found: error

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both clones are pinned by ref, so the cache key can be the ref itself.
      - name: Cache checkouts
        uses: actions/cache@v6
        with:
          path: |
            .webmin
            .easyrsa
          key: refs-${{ runner.os }}-webmin-2.653-easyrsa-v3.1.7

      - name: Check Webmin API
        run: make apicheck

      # Runs init against genuine easy-rsa on more than one release. This is
      # the stage that has caught every defect the mocked suite could not see,
      # so it runs on every push rather than on request.
      - name: Test against easy-rsa releases
        run: make e2e-matrix

  tunnel:
    name: E2E tunnel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner has a tun device already; loading the module is a no-op
      # where it is built in, and harmless where it is not.
      - name: Check tun device
        run: |
          sudo modprobe tun || true
          test -c /dev/net/tun

      # Builds a server with the tools, connects a client through it, revokes
      # that client and confirms it can no longer connect. Every other stage
      # checks the software's parts; this one checks that it works.
      - name: Run tunnel test
        run: make e2e-tunnel

  webmin:
    name: E2E Webmin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the package into Webmin 2.653 and drives the module over
      # HTTP: the client list, the download page, the profile and the
      # refusals. This is the only stage that can tell whether a page renders.
      - name: Run Webmin test
        run: make e2e-webmin
